<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082f55">
  <title>Tiada Internet | TEMIN HUB</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#082f55,#0f4c81);font-family:Arial,sans-serif;color:#fff;padding:24px}.card{width:min(100%,420px);text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:32px;padding:34px 24px;box-shadow:0 24px 60px rgba(0,0,0,.25)}img{width:96px;height:96px;border-radius:26px;box-shadow:0 14px 34px rgba(0,0,0,.25)}h1{margin:22px 0 8px;font-size:25px}.school{color:#fcd34d;font-size:11px;font-weight:800;letter-spacing:.16em}.message{color:#dbeafe;font-size:14px;line-height:1.55}.note{margin-top:18px;color:#bfdbfe;font-size:12px}button{margin-top:22px;border:0;border-radius:16px;background:#fcd34d;color:#082f55;font-weight:800;padding:13px 20px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="icons/icon-192.png" alt="Ikon TEMIN HUB">

    <p class="message">TEMIN HUB masih boleh dibuka, tetapi sistem luar seperti ePIBG+, AppSheet dan portal KPM memerlukan Internet.</p>

</html>
